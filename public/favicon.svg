<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2033"/>
      <stop offset="1" stop-color="#0c0e16"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <g clip-path="url(#round)" shape-rendering="crispEdges">
    <!-- falling powder -->
    <g fill="#d8bd7a">
      <rect x="6" y="2" width="2" height="2"/>
      <rect x="24" y="4" width="2" height="2"/>
      <rect x="26" y="10" width="2" height="2"/>
      <rect x="4" y="18" width="2" height="2"/>
    </g>

    <!-- flower -->
    <g fill="#ef7bb0">
      <rect x="14" y="6" width="2" height="2"/>
      <rect x="16" y="6" width="2" height="2"/>
      <rect x="12" y="8" width="2" height="2"/>
      <rect x="18" y="8" width="2" height="2"/>
    </g>
    <g fill="#ffd25e">
      <rect x="14" y="8" width="2" height="2"/>
      <rect x="16" y="8" width="2" height="2"/>
    </g>

    <!-- stem -->
    <rect x="14" y="10" width="2" height="13" fill="#5bb85f"/>
    <rect x="16" y="10" width="2" height="13" fill="#3d9243"/>

    <!-- leaves -->
    <g fill="#5bb85f">
      <rect x="8" y="10" width="2" height="2"/>
      <rect x="6" y="12" width="2" height="2"/>
      <rect x="8" y="12" width="2" height="2"/>
      <rect x="8" y="14" width="2" height="2"/>
      <rect x="10" y="14" width="2" height="2"/>
      <rect x="20" y="10" width="2" height="2"/>
      <rect x="20" y="12" width="2" height="2"/>
      <rect x="22" y="12" width="2" height="2"/>
      <rect x="20" y="14" width="2" height="2"/>
      <rect x="22" y="14" width="2" height="2"/>
      <rect x="24" y="14" width="2" height="2"/>
    </g>

    <!-- sand mound -->
    <g fill="#d8bd7a">
      <rect x="12" y="20" width="8"  height="2"/>
      <rect x="8"  y="22" width="16" height="2"/>
      <rect x="4"  y="24" width="24" height="2"/>
      <rect x="2"  y="26" width="28" height="2"/>
    </g>
    <g fill="#ecd8a0">
      <rect x="12" y="20" width="2" height="2"/>
      <rect x="8"  y="22" width="4" height="2"/>
      <rect x="4"  y="24" width="4" height="2"/>
    </g>
    <g fill="#b9995c">
      <rect x="24" y="22" width="2" height="2"/>
      <rect x="26" y="24" width="2" height="2"/>
      <rect x="28" y="26" width="2" height="2"/>
      <rect x="0"  y="28" width="32" height="2"/>
      <rect x="0"  y="30" width="32" height="2"/>
    </g>
  </g>
</svg>
